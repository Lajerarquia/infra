# GymFlow en la EC2 ec2-apps. Construye los 5 servicios desde los repos clonados al lado de infra/:
#   ~/gymflow/infra/apps/compose.yml  →  ../../ms-gymflow-{bff,catalog,reservations,notify,mq-admin}
#
# - Solo el BFF publica un puerto (8080). catalog, reservations, notify y mq-admin quedan en la red interna
#   "gymflow": desde internet no se llega a ellos; el BFF los llama por el nombre del servicio.
# - mq-admin se usa a través del BFF (/api/admin/mq/**, solo rol Admin), sin publicar su puerto.
# - RabbitMQ corre en otra EC2 (ec2-mq, infra/mq/compose.yml). reservations publica ahí y notify consume.
# - Las variables salen de apps/.env (ignorado por git). Las obligatorias usan ${VAR:?mensaje}:
#   si faltan, "docker compose up" se detiene con ese mensaje en vez de arrancar mal configurado.
# - Memoria (t3.medium, 4 GB): 512 MB para bff, catalog y reservations; 384 MB para notify y mq-admin, que no tienen
#   BD ni mucha carga. Total ~2,3 GB. La JVM respeta el límite del contenedor y usa el 70 % para el heap.

name: gymflow

x-java: &java
  restart: unless-stopped
  mem_limit: 512m
  networks: [gymflow]
  environment: &java-env
    JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
    TZ: UTC

# Healthcheck sin curl: la imagen eclipse-temurin trae bash, que puede abrir una conexión TCP con /dev/tcp.
# Se pide /actuator/health y se busca "UP". En catalog y reservations ese health incluye la conexión a RDS,
# así que "healthy" significa "la app arrancó y llega a la base de datos".
x-health: &health
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 90s

services:
  ms-gymflow-catalog:
    <<: *java
    build: ../../ms-gymflow-catalog
    image: gymflow/ms-gymflow-catalog:latest
    container_name: ms-gymflow-catalog
    environment:
      <<: *java-env
      DB_URL: ${DB_URL:?Falta DB_URL en .env}
      DB_USERNAME: ${DB_USERNAME:?Falta DB_USERNAME en .env}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
    expose: ["8082"]
    healthcheck:
      <<: *health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]

  ms-gymflow-reservations:
    <<: *java
    build: ../../ms-gymflow-reservations
    image: gymflow/ms-gymflow-reservations:latest
    container_name: ms-gymflow-reservations
    environment:
      <<: *java-env
      DB_URL: ${DB_URL:?Falta DB_URL en .env}
      DB_USERNAME: ${DB_USERNAME:?Falta DB_USERNAME en .env}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      CATALOG_URL: ${CATALOG_URL:-http://ms-gymflow-catalog:8082}
      # Publica email y ticket al CONFIRMAR. Si RabbitMQ no responde, la reserva igual se confirma.
      RABBITMQ_ADDRESSES: ${RABBITMQ_ADDRESSES:?Falta RABBITMQ_ADDRESSES en .env}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-gymflow}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Falta RABBITMQ_PASSWORD en .env}
    expose: ["8081"]
    depends_on:
      ms-gymflow-catalog:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]

  ms-gymflow-bff:
    <<: *java
    build: ../../ms-gymflow-bff
    image: gymflow/ms-gymflow-bff:latest
    container_name: ms-gymflow-bff
    environment:
      <<: *java-env
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:?Falta AZURE_TENANT_ID en .env}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:?Falta AZURE_CLIENT_ID en .env}
      GYMFLOW_CORS_ORIGINS: ${GYMFLOW_CORS_ORIGINS:-http://localhost:4200}
      RESERVATIONS_URL: ${RESERVATIONS_URL:-http://ms-gymflow-reservations:8081}
      CATALOG_URL: ${CATALOG_URL:-http://ms-gymflow-catalog:8082}
      # /api/admin/mq/** (solo Admin) se reenvía a mq-admin por la red interna. No depende de él para arrancar:
      # si mq-admin no está, esas rutas responden 503 y el resto de la API sigue funcionando.
      MQ_ADMIN_URL: ${MQ_ADMIN_URL:-http://ms-gymflow-mq-admin:8084}
    # El único puerto publicado en la EC2. Lo consume el API Gateway (security group gymflow-apps-sg: 8080).
    ports: ["8080:8080"]
    depends_on:
      ms-gymflow-catalog:
        condition: service_healthy
      ms-gymflow-reservations:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]

  # Consumidor RabbitMQ (EP2). Declara la topología al conectarse. Su health incluye la conexión a RabbitMQ.
  ms-gymflow-notify:
    <<: *java
    mem_limit: 384m
    build: ../../ms-gymflow-notify
    image: gymflow/ms-gymflow-notify:latest
    container_name: ms-gymflow-notify
    environment:
      <<: *java-env
      RABBITMQ_ADDRESSES: ${RABBITMQ_ADDRESSES:?Falta RABBITMQ_ADDRESSES en .env}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-gymflow}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Falta RABBITMQ_PASSWORD en .env}
      # Solo para la demo de reintentos y DLQ: NINGUNA, TRANSITORIA o PERMANENTE
      SIMULAR_FALLA: ${SIMULAR_FALLA:-NINGUNA}
    expose: ["8083"]
    healthcheck:
      <<: *health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]

  # Administración de RabbitMQ (colas, mensajes de prueba, reproceso de DLQ). Sin puertos publicados:
  # se usa a través del BFF (/api/admin/mq/**, solo Admin).
  ms-gymflow-mq-admin:
    <<: *java
    mem_limit: 384m
    build: ../../ms-gymflow-mq-admin
    image: gymflow/ms-gymflow-mq-admin:latest
    container_name: ms-gymflow-mq-admin
    environment:
      <<: *java-env
      RABBITMQ_ADDRESSES: ${RABBITMQ_ADDRESSES:?Falta RABBITMQ_ADDRESSES en .env}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-gymflow}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Falta RABBITMQ_PASSWORD en .env}
      RABBITMQ_MANAGEMENT_URL: ${RABBITMQ_MANAGEMENT_URL:?Falta RABBITMQ_MANAGEMENT_URL en .env}
    expose: ["8084"]
    healthcheck:
      <<: *health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8084 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]

networks:
  gymflow:
    name: gymflow
