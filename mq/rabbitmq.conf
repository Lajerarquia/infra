# Configuración común de los dos nodos RabbitMQ de GymFlow (se monta en /etc/rabbitmq/rabbitmq.conf).

# --- Clúster de 2 nodos ---
# Cada nodo conoce la lista completa; al arrancar por primera vez se unen solos (sin "rabbitmqctl join_cluster").
# Los nombres son rabbit@<hostname>, por eso el compose fija "hostname: rabbit1" y "hostname: rabbit2".
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2

# --- Memoria (EC2 t3.medium del Learner Lab: 4 GB para los dos nodos y el sistema) ---
# Se fija a mano cuánta memoria "ve" cada nodo (igual al mem_limit del compose), para no depender de que
# RabbitMQ detecte el límite del contenedor. Al llegar al 60 % (~600 MB) RabbitMQ frena a los publicadores
# en vez de dejar que el contenedor muera por falta de memoria.
total_memory_available_override_value = 1GB
vm_memory_high_watermark.relative = 0.6

# --- Disco (el EBS por defecto del Learner Lab es chico) ---
# Bajo 1 GB libre, RabbitMQ deja de aceptar mensajes en vez de llenar el disco.
disk_free_limit.absolute = 1GB
